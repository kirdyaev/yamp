<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yamp</title>
    <link rel="stylesheet" href="/src/player.css" />
  </head>
  <body>
    <div id="player-stage">
      <div id="webamp-anchor" aria-label="Webamp player"></div>
      <div id="yamamp-dock" class="yamamp-dock" title="Drag to move Yamp">
        <button id="dock-ml-btn" class="dock-btn dock-btn-ml" type="button" title="Open Media Library (Cmd+L)">
          ML
        </button>
        <button id="dock-status-btn" class="dock-status dock-status-warn" type="button" title="Yandex Music status">
          <span class="dock-led"></span>
          <span id="dock-status-text">NO TOKEN</span>
        </button>
        <button id="dock-cfg-btn" class="dock-btn" type="button" title="Settings (Cmd+,)">
          CFG
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
